[build]
  command = "npm run build"
  publish = "dist"

# Links viejos de proyecto: /proyecto.html?p=<slug> pasa a /proyecto/<slug>/.
# force = true porque proyecto.html existe en dist/ y sin eso el archivo le gana a la regla.
# Si el hosting reescribiera la ruta antes de la regla, project.js también lee ?p= y corrige la barra de direcciones.
[[redirects]]
  from = "/proyecto.html"
  to = "/proyecto/:p/"
  status = 301
  force = true
  query = {p = ":p"}

# Los archivos de /assets/ llevan hash en el nombre: se pueden cachear para siempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/og.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
